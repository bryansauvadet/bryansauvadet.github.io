media:
  - name: site_images
    label: Images du site
    input: assets/images
    output: /assets/images
    categories: [image]
    extensions: [jpg, jpeg, png, webp, avif, gif, svg]
    rename: false
    commit:
      templates:
        create: "media: ajout {filename}"
        update: "media: remplacement {filename}"
        delete: "media: suppression {filename}"
        rename: "media: renommage {oldFilename} -> {newFilename}"

  - name: page_illustrations
    label: Illustrations par page
    input: assets/img
    output: /assets/img
    categories: [image]
    extensions: [jpg, jpeg, png, webp, avif, gif, svg]
    rename: false

  - name: architecture_images
    label: Histoire de l’architecture bouddhique
    input: assets/images/histoire-architecture-bouddhique
    output: /assets/images/histoire-architecture-bouddhique
    categories: [image]
    extensions: [jpg, jpeg, png, webp, avif, gif, svg]
    rename: random

