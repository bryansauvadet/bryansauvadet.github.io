            label: "🇫🇷 Français"
            type: file
            path: fr/cartes/histoire-architecture-bouddhique.qmd
            format: yaml-frontmatter
            operations:
              create: false
              rename: false
              delete: false
            fields:
              - name: illustrations
                component: architecture_illustrations
                label: Illustrations
          - name: hab_en
            label: "🇬🇧 English"
            type: file
            path: en/maps/histoire-architecture-bouddhique.qmd
