<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="t3"><title id="t3">대도로: 이동과 네트워크</title><style>.serif{font-family:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic","Noto Serif CJK KR",serif;font-weight:700}.sans{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif}.sansb{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;font-weight:700}.dark{fill:#0f303e}.blue{fill:#154e7e}.white{fill:#fff9eb}.redtxt{fill:#a52b22}.cream{fill:#fdf5e2}.navy{fill:#083f4c}.red{fill:#a52b22}</style><image href="/assets/img/yom-sungik/yom-sungik-infographie-3-en.webp" x="0" y="0" width="1448" height="1086" preserveAspectRatio="xMidYMid slice"/><rect x="190" y="0" width="1045" height="188" rx="0" class="cream" opacity="0.985"/><text x="712" y="61" font-size="50" class="serif dark" text-anchor="middle">대도(大都)로: 이동과 네트워크</text><text x="712" y="106" font-size="31" class="serif dark" text-anchor="middle">1293년 원나라 사행</text><text x="712" y="137" font-size="19" class="sans blue" text-anchor="middle"><tspan x="712" dy="0">1293년, 염승익은 충렬왕과 공주를 수행하여 원에 갔다.</tspan><tspan x="712" dy="27">이 여정은 고려와 대도를 잇는 정치·의례·문헌 교류의 장이었다.</tspan></text><rect x="12" y="199" width="638" height="53" rx="0" class="red" opacity="1"/><text x="331" y="234" font-size="27" class="serif white" text-anchor="middle">개경에서 대도까지의 경로</text><rect x="660" y="199" width="450" height="53" rx="0" class="navy" opacity="1"/><text x="885" y="234" font-size="27" class="serif white" text-anchor="middle">대도에서의 활동</text><rect x="1117" y="199" width="331" height="53" rx="0" class="red" opacity="1"/><text x="1282" y="234" font-size="22" class="serif white" text-anchor="middle">이 체류가 보여주는 것</text><rect x="77" y="286" width="195" height="93" rx="0" class="red" opacity="1"/><text x="174" y="321" font-size="20" class="serif white" text-anchor="middle"><tspan x="174" dy="0">대도 大都</tspan><tspan x="174" dy="26">(오늘날 베이징)</tspan></text><rect x="282" y="386" width="160" height="66" rx="0" class="cream" opacity="0.98"/><text x="362" y="411" font-size="16" class="sansb dark" text-anchor="middle"><tspan x="362" dy="0">요동</tspan><tspan x="362" dy="21">(동부 지역)</tspan></text><rect x="390" y="486" width="150" height="65" rx="0" class="cream" opacity="0.98"/><text x="465" y="511" font-size="16" class="sansb dark" text-anchor="middle"><tspan x="465" dy="0">평양</tspan><tspan x="465" dy="21">(추정 경유지)</tspan></text><rect x="500" y="621" width="143" height="80" rx="0" class="red" opacity="1"/><text x="571" y="650" font-size="20" class="serif white" text-anchor="middle"><tspan x="571" dy="0">개경</tspan><tspan x="571" dy="25">開京</tspan></text><rect x="278" y="289" width="230" height="64" rx="0" class="cream" opacity="0.96"/><text x="393" y="330" font-size="28" class="serif dark" text-anchor="middle">원  元</text><rect x="505" y="539" width="130" height="58" rx="0" class="cream" opacity="0.96"/><text x="570" y="575" font-size="22" class="serif dark" text-anchor="middle">고려</text><rect x="500" y="430" width="140" height="58" rx="0" class="cream" opacity="0.96"/><text x="570" y="466" font-size="19" class="serif blue" text-anchor="middle">동해</text><rect x="270" y="639" width="155" height="57" rx="0" class="cream" opacity="0.96"/><text x="348" y="675" font-size="19" class="serif blue" text-anchor="middle">황해</text><rect x="805" y="369" width="192" height="83" rx="0" class="red" opacity="1"/><text x="901" y="400" font-size="20" class="serif white" text-anchor="middle"><tspan x="901" dy="0">원 조정</tspan><tspan x="901" dy="26">궁성 공간</tspan></text><rect x="810" y="456" width="182" height="85" rx="0" class="cream" opacity="0.97"/><text x="901" y="506" font-size="17" class="sansb blue" text-anchor="middle">개략적 재구성</text><rect x="699" y="621" width="180" height="75" rx="0" class="navy" opacity="1"/><text x="789" y="650" font-size="19" class="serif white" text-anchor="middle"><tspan x="789" dy="0">불교계와</tspan><tspan x="789" dy="24">의례</tspan></text><rect x="895" y="621" width="190" height="75" rx="0" class="red" opacity="1"/><text x="990" y="650" font-size="18" class="serif white" text-anchor="middle"><tspan x="990" dy="0">문헌·인쇄물의</tspan><tspan x="990" dy="24">유통</tspan></text><rect x="1117" y="252" width="331" height="755" rx="0" class="cream" opacity="0.99"/><circle cx="1160" cy="315" r="29" fill="#356c5c"/><circle cx="1160" cy="428" r="29" fill="#a52b22"/><circle cx="1160" cy="541" r="29" fill="#154e7e"/><text x="1160" y="323" font-size="20" class="serif white" text-anchor="middle">宮</text><text x="1160" y="436" font-size="20" class="serif white" text-anchor="middle">佛</text><text x="1160" y="549" font-size="20" class="serif white" text-anchor="middle">經</text><text x="1200" y="295" font-size="17" class="sansb blue" text-anchor="start"><tspan x="1200" dy="0">충렬왕 궁정과의</tspan><tspan x="1200" dy="25">긴밀한 관계</tspan></text><text x="1200" y="408" font-size="17" class="sansb blue" text-anchor="start"><tspan x="1200" dy="0">원 불교 네트워크에</tspan><tspan x="1200" dy="25">대한 개방성</tspan></text><text x="1200" y="521" font-size="17" class="sansb blue" text-anchor="start"><tspan x="1200" dy="0">다라니와 의례 관행의</tspan><tspan x="1200" dy="25">유통에 유리한 환경</tspan></text><rect x="1117" y="610" width="331" height="48" rx="0" class="navy" opacity="1"/><text x="1282" y="643" font-size="23" class="serif white" text-anchor="middle">범례</text><text x="1165" y="699" font-size="16" class="sans blue" text-anchor="start"><tspan x="1165" dy="0">대도로의 이동 경로</tspan><tspan x="1165" dy="38">궁성 내부의 개략적 동선</tspan><tspan x="1165" dy="38">궁정 중심</tspan><tspan x="1165" dy="38">불교 중심</tspan></text><line x1="1129" y1="690" x2="1151" y2="690" stroke="#a52b22" stroke-width="5"/><line x1="1129" y1="728" x2="1151" y2="728" stroke="#083f4c" stroke-width="4" stroke-dasharray="6 4"/><rect x="1131" y="759" width="18" height="16" fill="#a52b22"/><rect x="1131" y="797" width="18" height="16" fill="#083f4c"/><rect x="1117" y="823" width="331" height="50" rx="0" class="red" opacity="1"/><text x="1282" y="856" font-size="22" class="serif white" text-anchor="middle">사료상의 주의</text><text x="1140" y="909" font-size="15" class="sans dark" text-anchor="start"><tspan x="1140" dy="0">대도로 향한 전체 경로는 사료로 확인되지만,</tspan><tspan x="1140" dy="24">수도 내부의 세부 이동은 개략적 시각 재구성이다.</tspan></text><rect x="356" y="1033" width="740" height="48" rx="0" class="cream" opacity="0.98"/><text x="726" y="1063" font-size="14" class="serif blue" text-anchor="middle">사료와 최근 연구의 고려–원 네트워크를 바탕으로 한 시각적 개략도</text></svg>