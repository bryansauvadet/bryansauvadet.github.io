<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="t">
<title id="t">대도로: 이동과 네트워크</title>
<style>
.serif{font-family:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif;font-weight:700}
.sans{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.sansb{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:700}
.dark{fill:#0f303e}.blue{fill:#154e7e}.white{fill:#fff9eb}.redtxt{fill:#a52b22}
.cream{fill:#fdf5e2}.navy{fill:#083f4c}.red{fill:#a52b22}
</style>
<image href="/assets/img/yom-sungik/yom-sungik-infographie-3-en.webp" x="0" y="0" width="1448" height="1086" preserveAspectRatio="none"/><rect x="200" y="0" width="1060" height="190" class="cream"/><text x="730" y="67" font-size="54" class="serif dark" text-anchor="middle">대도(大都)로: 이동과 네트워크</text><text x="730" y="112" font-size="33" class="serif dark" text-anchor="middle">1293년 원나라 사행</text><text x="730" y="143" font-size="22" class="sans blue" text-anchor="middle"><tspan x="730" dy="0">1293년, 염승익은 충렬왕과 공주를 수행하여 원에 갔다.</tspan><tspan x="730" dy="29.700000000000003">이 여정은 고려와 대도를 잇는 정치·의례·문헌 교류의 장이었다.</tspan></text><rect x="10" y="198" width="645" height="57" class="red"/><text x="333" y="237" font-size="28" class="serif white" text-anchor="middle">개경에서 대도까지의 경로</text><rect x="75" y="285" width="200" height="100" class="red"/><text x="175" y="326" font-size="22" class="serif white" text-anchor="middle"><tspan x="175" dy="0">대도 大都</tspan><tspan x="175" dy="27.5">(오늘날 베이징)</tspan></text><rect x="270" y="378" width="177" height="78" class="cream"/><text x="359" y="407" font-size="18" class="sansb dark" text-anchor="middle"><tspan x="359" dy="0">요동</tspan><tspan x="359" dy="21.599999999999998">(동부 지역)</tspan></text><rect x="380" y="482" width="160" height="69" class="cream"/><text x="460" y="507" font-size="18" class="sansb dark" text-anchor="middle"><tspan x="460" dy="0">평양</tspan><tspan x="460" dy="21.599999999999998">(추정 경유지)</tspan></text><rect x="490" y="618" width="155" height="89" class="red"/><text x="568" y="669" font-size="22" class="serif white" text-anchor="middle">개경 開京</text><rect x="268" y="286" width="237" height="80" class="cream"/><text x="387" y="337" font-size="30" class="serif dark" text-anchor="middle">원  元</text><rect x="494" y="535" width="148" height="75" class="cream"/><text x="568" y="583" font-size="24" class="serif dark" text-anchor="middle">고려</text><rect x="495" y="425" width="155" height="97" class="cream"/><text x="573" y="482" font-size="21" class="sansb blue" text-anchor="middle">동해</text><rect x="258" y="636" width="172" height="78" class="cream"/><text x="344" y="686" font-size="21" class="sansb blue" text-anchor="middle">황해</text><rect x="650" y="198" width="470" height="57" class="navy"/><text x="885" y="237" font-size="28" class="serif white" text-anchor="middle">대도에서의 활동</text><rect x="785" y="365" width="210" height="91" class="red"/><text x="890" y="402" font-size="22" class="serif white" text-anchor="middle"><tspan x="890" dy="0">원 조정</tspan><tspan x="890" dy="26.4">궁성 공간</tspan></text><rect x="790" y="452" width="202" height="110" class="cream"/><text x="891" y="516" font-size="19" class="sansb blue" text-anchor="middle">개략적 재구성</text><rect x="695" y="615" width="180" height="89" class="navy"/><text x="785" y="668" font-size="20" class="serif white" text-anchor="middle">불교계와 의례</text><rect x="890" y="615" width="195" height="89" class="red"/><text x="988" y="668" font-size="19" class="serif white" text-anchor="middle">문헌·인쇄물의 유통</text><rect x="1110" y="198" width="338" height="58" class="red"/><text x="1279" y="237" font-size="24" class="serif white" text-anchor="middle">이 체류가 보여주는 것</text><rect x="1180" y="256" width="268" height="359" class="cream"/><text x="1195" y="307" font-size="20" class="sansb blue" text-anchor="start"><tspan x="1195" dy="0">충렬왕 궁정과의 긴밀한 관계</tspan><tspan x="1195" dy="51">원 불교 네트워크에 대한 개방성</tspan><tspan x="1195" dy="51">다라니와 의례 관행의 유통에</tspan><tspan x="1195" dy="51">유리한 환경</tspan></text><rect x="1110" y="618" width="338" height="56" class="navy"/><text x="1279" y="656" font-size="25" class="serif white" text-anchor="middle">범례</text><rect x="1180" y="674" width="268" height="146" class="cream"/><text x="1195" y="700" font-size="18" class="sans blue" text-anchor="start"><tspan x="1195" dy="0">대도로의 이동 경로</tspan><tspan x="1195" dy="26.099999999999998">궁성 내부의 개략적 동선</tspan><tspan x="1195" dy="26.099999999999998">궁정 중심</tspan><tspan x="1195" dy="26.099999999999998">불교 중심</tspan></text><rect x="1110" y="818" width="338" height="55" class="red"/><text x="1279" y="855" font-size="24" class="serif white" text-anchor="middle">사료상의 주의</text><rect x="1160" y="873" width="288" height="135" class="cream"/><text x="1175" y="900" font-size="17" class="sans dark" text-anchor="start"><tspan x="1175" dy="0">대도로 향한 전체 경로는 사료로 확인되지만,</tspan><tspan x="1175" dy="23.799999999999997">수도 내부의 세부 이동은</tspan><tspan x="1175" dy="23.799999999999997">개략적 시각 재구성이다.</tspan></text><rect x="365" y="1030" width="775" height="56" class="cream"/><text x="753" y="1066" font-size="16" class="sans blue" text-anchor="middle">사료와 최근 연구의 고려–원 네트워크를 바탕으로 한 시각적 개략도</text></svg>