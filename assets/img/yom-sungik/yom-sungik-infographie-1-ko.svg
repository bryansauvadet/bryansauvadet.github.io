 <image href="/assets/img/yom-sungik/yom-sungik-infographie-1-en.webp" x="0" y="0" width="1448" height="1086" preserveAspectRatio="xMidYMid slice"/><rect x="145" y="0" width="1105" height="187" rx="0" class="cream" opacity="0.985"/><text x="697" y="61" font-size="47" class="serif dark" text-anchor="middle">염승익 廉承益: 종교 네트워크와 의례의 순환</text><text x="697" y="106" font-size="29" class="serif dark" text-anchor="middle">개경과 원 제국권을 중심으로</text><text x="697" y="154" font-size="20" class="sans blue" text-anchor="middle">연대기 없는 종합도: 궁정·사찰·문헌·불교 실천이 교차하는 지점의 인물상</text><rect x="83" y="193" width="430" height="54" rx="0" class="red" opacity="1"/><text x="298" y="229" font-size="28" class="serif white" text-anchor="middle">충렬왕의 궁정</text><rect x="20" y="475" width="575" height="120" rx="0" class="cream" opacity="0.985"/><text x="58" y="507" font-size="19" class="sansb blue" text-anchor="start"><tspan x="58" dy="0">권력과의 긴밀한 관계</tspan><tspan x="58" dy="29">궁정에서 인정된 활동</tspan><tspan x="58" dy="29">고려 정치 공간에 깊이 결합</tspan></text><rect x="680" y="193" width="410" height="54" rx="0" class="navy" opacity="1"/><text x="885" y="229" font-size="28" class="serif white" text-anchor="middle">사찰과 탑</text><rect x="854" y="247" width="210" height="42" rx="0" class="red" opacity="1"/><text x="959" y="275" font-size="17" class="serif white" text-anchor="middle">현화사 玄化寺</text><rect x="646" y="313" width="228" height="47" rx="0" class="red" opacity="1"/><text x="760" y="344" font-size="17" class="serif white" text-anchor="middle">왕륜사 王輪寺</text><rect x="907" y="361" width="205" height="48" rx="0" class="red" opacity="1"/><text x="1010" y="393" font-size="16" class="serif white" text-anchor="middle">남계원 南溪院</text><rect x="722" y="480" width="390" height="116" rx="0" class="cream" opacity="0.985"/><text x="748" y="511" font-size="18" class="sansb blue" text-anchor="start"><tspan x="748" dy="0">개경 일대의 불교 조영</tspan><tspan x="748" dy="28">탑 복원</tspan><tspan x="748" dy="28">염승익의 관여와 연결된 사찰</tspan></text><rect x="78" y="594" width="440" height="53" rx="0" class="red" opacity="1"/><text x="298" y="630" font-size="27" class="serif white" text-anchor="middle">문헌·다라니·경전</text><rect x="20" y="842" width="580" height="112" rx="0" class="cream" opacity="0.985"/><text x="55" y="875" font-size="18" class="sansb blue" text-anchor="start"><tspan x="55" dy="0">다라니와 의례용 인쇄물</tspan><tspan x="55" dy="28">경전의 유통</tspan><tspan x="55" dy="28">호법 이미지의 제작과 활용</tspan></text><rect x="680" y="594" width="390" height="53" rx="0" class="navy" opacity="1"/><text x="875" y="630" font-size="27" class="serif white" text-anchor="middle">원 네트워크</text><rect x="790" y="644" width="165" height="42" rx="0" class="red" opacity="1"/><text x="873" y="672" font-size="18" class="serif white" text-anchor="middle">대도 大都</text><rect x="710" y="842" width="402" height="112" rx="0" class="cream" opacity="0.985"/><text x="742" y="881" font-size="19" class="sansb blue" text-anchor="start"><tspan x="742" dy="0">원의 불교계</tspan><tspan x="742" dy="31">문헌과 수행의 교류</tspan></text><rect x="506" y="620" width="276" height="112" rx="0" class="navy" opacity="1"/><text x="644" y="666" font-size="28" class="serif white" text-anchor="middle">염승익</text><text x="644" y="708" font-size="23" class="serif white" text-anchor="middle">廉承益</text><rect x="1115" y="190" width="333" height="790" rx="0" class="cream" opacity="0.99"/><rect x="1115" y="192" width="333" height="55" rx="0" class="red" opacity="1"/><text x="1281" y="229" font-size="23" class="serif white" text-anchor="middle">이미지가 보여주는 것</text><circle cx="1157" cy="305" r="31" fill="#a52b22"/><circle cx="1157" cy="426" r="31" fill="#356c5c"/><circle cx="1157" cy="547" r="31" fill="#154e7e"/><text x="1157" y="313" font-size="22" class="serif white" text-anchor="middle">宮</text><text x="1157" y="434" font-size="21" class="serif white" text-anchor="middle">網</text><text x="1157" y="555" font-size="21" class="serif white" text-anchor="middle">經</text><text x="1201" y="286" font-size="18" class="sansb blue" text-anchor="start"><tspan x="1201" dy="0">정치 권력과 불교계의</tspan><tspan x="1201" dy="27">교차점에 선 인물</tspan></text><text x="1201" y="407" font-size="18" class="sansb blue" text-anchor="start"><tspan x="1201" dy="0">개경·사찰·대도를</tspan><tspan x="1201" dy="27">연결하는 네트워크</tspan></text><text x="1201" y="528" font-size="18" class="sansb blue" text-anchor="start"><tspan x="1201" dy="0">탑·다라니·경전·인쇄물의</tspan><tspan x="1201" dy="27">공동 순환</tspan></text><rect x="1115" y="610" width="333" height="50" rx="0" class="navy" opacity="1"/><text x="1281" y="644" font-size="24" class="serif white" text-anchor="middle">범례</text><text x="1160" y="704" font-size="18" class="sans blue" text-anchor="start"><tspan x="1160" dy="0">궁정 중심</tspan><tspan x="1160" dy="55">사찰 중심</tspan><tspan x="1160" dy="55">문헌의 유통</tspan><tspan x="1160" dy="55">의례적 관계</tspan></text><line x1="1128" y1="694" x2="1148" y2="694" stroke="#a52b22" stroke-width="5"/><line x1="1128" y1="749" x2="1148" y2="749" stroke="#083f4c" stroke-width="5"/><line x1="1128" y1="804" x2="1148" y2="804" stroke="#154e7e" stroke-width="5"/><path d="M1128 859 C1135 850 1141 850 1148 859" fill="none" stroke="#083f4c" stroke-width="4" stroke-dasharray="5 5"/><rect x="385" y="1032" width="675" height="48" rx="0" class="cream" opacity="0.98"/><text x="722" y="1062" font-size="15" class="serif blue" text-anchor="middle">사료에 근거한 주제별 개략도 · 관계는 종합적으로 제시함</text></svg>