<image href="/assets/img/yom-sungik/yom-sungik-infographie-1-en.webp" x="0" y="0" width="1448" height="1086" preserveAspectRatio="none"/><rect x="150" y="0" width="1130" height="190" class="cream"/><text x="715" y="63" font-size="48" class="serif dark" text-anchor="middle">염승익 廉承益: 종교 네트워크와 의례의 순환</text><text x="715" y="108" font-size="29" class="serif dark" text-anchor="middle">개경과 원 제국권을 중심으로</text><text x="715" y="158" font-size="21" class="sans blue" text-anchor="middle">연대기 없는 종합도: 궁정·사찰·문헌·불교 실천이 교차하는 지점의 인물상</text><rect x="85" y="192" width="430" height="56" class="red"/><text x="300" y="231" font-size="28" class="serif white" text-anchor="middle">충렬왕의 궁정</text><rect x="78" y="470" width="517" height="132" class="cream"/><text x="92" y="500" font-size="20" class="sansb blue" text-anchor="start"><tspan x="92" dy="0">권력과의 근접성</tspan><tspan x="92" dy="27">궁정에서 인정된 활동</tspan><tspan x="92" dy="27">고려 정치 공간에 깊이 결합</tspan></text><rect x="682" y="192" width="408" height="56" class="navy"/><text x="886" y="231" font-size="28" class="serif white" text-anchor="middle">사찰과 탑</text><rect x="862" y="246" width="196" height="46" class="red"/><text x="960" y="277" font-size="18" class="serif white" text-anchor="middle">현화사 玄化寺</text><rect x="645" y="312" width="227" height="53" class="red"/><text x="759" y="346" font-size="18" class="serif white" text-anchor="middle">왕륜사 王輪寺</text><rect x="910" y="360" width="200" height="57" class="red"/><text x="1010" y="397" font-size="17" class="serif white" text-anchor="middle">남계원 南溪院</text><rect x="745" y="470" width="365" height="130" class="cream"/><text x="760" y="499" font-size="19" class="sansb blue" text-anchor="start"><tspan x="760" dy="0">개경 일대의 불교 조영</tspan><tspan x="760" dy="26.599999999999998">탑 복원</tspan><tspan x="760" dy="26.599999999999998">염승익의 관여와 연결된 사찰</tspan></text><rect x="65" y="590" width="455" height="60" class="red"/><text x="293" y="630" font-size="27" class="serif white" text-anchor="middle">문헌·다라니·경전</text><rect x="70" y="832" width="535" height="153" class="cream"/><text x="90" y="866" font-size="19" class="sansb blue" text-anchor="start"><tspan x="90" dy="0">다라니와 의례용 인쇄물</tspan><tspan x="90" dy="26.599999999999998">경전의 유통</tspan><tspan x="90" dy="26.599999999999998">호법 이미지의 제작과 활용</tspan></text><rect x="680" y="590" width="385" height="60" class="navy"/><text x="873" y="630" font-size="28" class="serif white" text-anchor="middle">원 네트워크</text><rect x="785" y="640" width="167" height="50" class="red"/><text x="868" y="673" font-size="20" class="serif white" text-anchor="middle">대도 大都</text><rect x="740" y="832" width="375" height="153" class="cream"/><text x="760" y="868" font-size="19" class="sansb blue" text-anchor="start"><tspan x="760" dy="0">원의 불교계</tspan><tspan x="760" dy="28.5">문헌과 수행의 교류</tspan></text><rect x="505" y="620" width="275" height="115" class="navy"/><text x="643" y="670" font-size="29" class="serif white" text-anchor="middle">염승익</text><text x="643" y="716" font-size="23" class="serif white" text-anchor="middle">廉承益</text><rect x="1108" y="192" width="340" height="58" class="red"/><text x="1278" y="231" font-size="23" class="serif white" text-anchor="middle">이미지가 보여주는 것</text><rect x="1175" y="250" width="273" height="365" class="cream"/><text x="1190" y="300" font-size="20" class="sansb blue" text-anchor="start"><tspan x="1190" dy="0">정치 권력과 불교계의</tspan><tspan x="1190" dy="28">교차점에 선 인물</tspan></text><text x="1190" y="420" font-size="20" class="sansb blue" text-anchor="start"><tspan x="1190" dy="0">개경·사찰·대도를 잇는</tspan><tspan x="1190" dy="28">네트워크</tspan></text><text x="1190" y="540" font-size="19" class="sansb blue" text-anchor="start"><tspan x="1190" dy="0">탑·다라니·경전·인쇄물의</tspan><tspan x="1190" dy="26.599999999999998">공동 순환</tspan></text><rect x="1108" y="610" width="340" height="58" class="navy"/><text x="1278" y="649" font-size="25" class="serif white" text-anchor="middle">범례</text><rect x="1180" y="668" width="268" height="280" class="cream"/><text x="1195" y="705" font-size="18" class="sans blue" text-anchor="start"><tspan x="1195" dy="0">궁정 중심</tspan><tspan x="1195" dy="46.800000000000004">사찰 중심</tspan><tspan x="1195" dy="46.800000000000004">문헌의 유통</tspan><tspan x="1195" dy="46.800000000000004">의례적 관계</tspan></text><rect x="390" y="1032" width="665" height="54" class="cream"/><text x="723" y="1066" font-size="16" class="sans blue" text-anchor="middle">사료에 근거한 주제별 개략도 · 관계는 종합적으로 제시함</text></svg>