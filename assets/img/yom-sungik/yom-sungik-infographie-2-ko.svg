<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="t">
<title id="t">개경 주변의 탑 복원과 불교 조영</title>
<style>
.serif{font-family:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif;font-weight:700}
.sans{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.sansb{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:700}
.dark{fill:#0f303e}.blue{fill:#154e7e}.white{fill:#fff9eb}.redtxt{fill:#a52b22}
.cream{fill:#fdf5e2}.navy{fill:#083f4c}.red{fill:#a52b22}
</style>
<image href="/assets/img/yom-sungik/yom-sungik-infographie-2-en.webp" x="0" y="0" width="1448" height="1086" preserveAspectRatio="none"/><rect x="190" y="0" width="1050" height="184" class="cream"/><text x="715" y="66" font-size="55" class="serif dark" text-anchor="middle">개경 주변의 탑 복원과 불교 조영</text><text x="715" y="111" font-size="33" class="serif dark" text-anchor="middle">1280–1281년</text><text x="715" y="142" font-size="23" class="sans blue" text-anchor="middle"><tspan x="715" dy="0">충렬왕 재위기에 염승익은 고려의 수도 개경에서</tspan><tspan x="715" dy="29.900000000000002">여러 주요 불교 조영 사업을 감독했다.</tspan></text><rect x="165" y="184" width="190" height="66" class="cream"/><text x="260" y="211" font-size="23" class="serif dark" text-anchor="middle"><tspan x="260" dy="0">송악산</tspan><tspan x="260" dy="26.45">松嶽山</tspan></text><rect x="870" y="450" width="235" height="80" class="cream"/><text x="988" y="480" font-size="21" class="serif dark" text-anchor="middle"><tspan x="988" dy="0">백천산</tspan><tspan x="988" dy="24.15">白川山</tspan></text><rect x="75" y="800" width="220" height="90" class="cream"/><text x="185" y="833" font-size="21" class="serif dark" text-anchor="middle"><tspan x="185" dy="0">궁덕산</tspan><tspan x="185" dy="24.15">宮德山</tspan></text><rect x="145" y="552" width="195" height="76" class="cream"/><text x="243" y="596" font-size="18" class="sansb blue" text-anchor="middle">지역의 작은 하천</text><rect x="198" y="247" width="330" height="59" class="red"/><text x="363" y="286" font-size="29" class="serif white" text-anchor="middle">왕륜사  王輪寺</text><rect x="205" y="398" width="315" height="67" class="cream"/><text x="363" y="440" font-size="23" class="sansb redtxt" text-anchor="middle">1281년 · 탑 복원</text><rect x="682" y="193" width="328" height="59" class="red"/><text x="846" y="232" font-size="29" class="serif white" text-anchor="middle">현화사  玄化寺</text><rect x="700" y="328" width="310" height="110" class="cream"/><text x="855" y="365" font-size="22" class="sansb redtxt" text-anchor="middle"><tspan x="855" dy="0">1280년 · 전각·법당 건립</tspan><tspan x="855" dy="31.9">1281년 · 사지 보수</tspan></text><rect x="780" y="503" width="322" height="59" class="navy"/><text x="941" y="542" font-size="27" class="serif white" text-anchor="middle">남계원  南溪院</text><rect x="780" y="645" width="315" height="92" class="cream"/><text x="938" y="700" font-size="22" class="sansb redtxt" text-anchor="middle">1281년 · 칠층석탑 복원</text><rect x="410" y="635" width="260" height="119" class="navy"/><text x="540" y="683" font-size="30" class="serif white" text-anchor="middle">개경  開京</text><text x="540" y="724" font-size="20" class="sansb white" text-anchor="middle">고려의 수도</text><rect x="1090" y="182" width="358" height="56" class="navy"/><text x="1269" y="220" font-size="27" class="serif white" text-anchor="middle">범례</text><rect x="1155" y="238" width="293" height="212" class="cream"/><text x="1188" y="268" font-size="20" class="sans blue" text-anchor="start"><tspan x="1188" dy="0">사찰 / 불교 조영</tspan><tspan x="1188" dy="41">복원된 탑</tspan><tspan x="1188" dy="41">수도</tspan><tspan x="1188" dy="41">감독 이동 경로</tspan><tspan x="1188" dy="41">(개경 출발)</tspan></text><rect x="1090" y="447" width="358" height="59" class="red"/><text x="1269" y="486" font-size="27" class="serif white" text-anchor="middle">주요 연표</text><rect x="1090" y="506" width="358" height="121" class="cream"/><text x="1110" y="536" font-size="20" class="sansb blue" text-anchor="start"><tspan x="1110" dy="0">1280년 — 현화사 조영</tspan><tspan x="1110" dy="29">1281년 — 보수·복원</tspan><tspan x="1110" dy="29">배경 — 충렬왕 재위</tspan></text><rect x="1090" y="620" width="358" height="61" class="navy"/><text x="1269" y="660" font-size="24" class="serif white" text-anchor="middle">지도가 보여주는 것</text><rect x="1160" y="681" width="288" height="319" class="cream"/><text x="1180" y="725" font-size="20" class="sansb blue" text-anchor="start"><tspan x="1180" dy="0">고려 수도권에 집중된 활동</tspan><tspan x="1180" dy="43">왕실의 주도 아래 진행된 사업</tspan><tspan x="1180" dy="43">정치 권력과 불교 후원이</tspan><tspan x="1180" dy="43">교차하는 인물상</tspan></text><rect x="395" y="1033" width="660" height="53" class="cream"/><text x="725" y="1067" font-size="17" class="sans blue" text-anchor="middle">사료를 바탕으로 한 개략도 · 위치는 대략적임</text></svg>