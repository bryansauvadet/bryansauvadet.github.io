<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="t2"><title id="t2">개경 주변의 탑 복원과 불교 조영</title><style>.serif{font-family:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic","Noto Serif CJK KR",serif;font-weight:700}.sans{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif}.sansb{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;font-weight:700}.dark{fill:#0f303e}.blue{fill:#154e7e}.white{fill:#fff9eb}.redtxt{fill:#a52b22}.cream{fill:#fdf5e2}.navy{fill:#083f4c}.red{fill:#a52b22}</style><image href="/assets/img/yom-sungik/yom-sungik-infographie-2-en.webp" x="0" y="0" width="1448" height="1086" preserveAspectRatio="xMidYMid slice"/><rect x="180" y="0" width="1035" height="178" rx="0" class="cream" opacity="0.985"/><text x="698" y="61" font-size="52" class="serif dark" text-anchor="middle">개경 주변의 탑 복원과 불교 조영</text><text x="698" y="107" font-size="31" class="serif dark" text-anchor="middle">1280–1281년</text><text x="698" y="137" font-size="20" class="sans blue" text-anchor="middle"><tspan x="698" dy="0">충렬왕 재위기에 염승익은 고려의 수도 개경에서</tspan><tspan x="698" dy="27">여러 주요 불교 조영 사업을 감독했다.</tspan></text><rect x="164" y="184" width="190" height="64" rx="0" class="cream" opacity="0.97"/><text x="259" y="211" font-size="20" class="serif dark" text-anchor="middle"><tspan x="259" dy="0">송악산</tspan><tspan x="259" dy="25">松嶽山</tspan></text><rect x="868" y="452" width="180" height="68" rx="0" class="cream" opacity="0.97"/><text x="958" y="480" font-size="18" class="serif dark" text-anchor="middle"><tspan x="958" dy="0">백천산</tspan><tspan x="958" dy="23">白川山</tspan></text><rect x="74" y="799" width="206" height="72" rx="0" class="cream" opacity="0.97"/><text x="177" y="827" font-size="18" class="serif dark" text-anchor="middle"><tspan x="177" dy="0">궁덕산</tspan><tspan x="177" dy="23">宮德山</tspan></text><rect x="142" y="548" width="200" height="60" rx="0" class="cream" opacity="0.97"/><text x="242" y="585" font-size="16" class="sansb blue" text-anchor="middle">지역의 작은 하천</text><rect x="196" y="249" width="332" height="54" rx="0" class="red" opacity="1"/><text x="362" y="285" font-size="27" class="serif white" text-anchor="middle">왕륜사  王輪寺</text><rect x="208" y="398" width="300" height="58" rx="0" class="cream" opacity="0.985"/><text x="358" y="435" font-size="21" class="sansb redtxt" text-anchor="middle">1281년 · 탑 복원</text><rect x="684" y="194" width="325" height="54" rx="0" class="red" opacity="1"/><text x="846" y="230" font-size="27" class="serif white" text-anchor="middle">현화사  玄化寺</text><rect x="706" y="329" width="300" height="93" rx="0" class="cream" opacity="0.985"/><text x="856" y="361" font-size="20" class="sansb redtxt" text-anchor="middle"><tspan x="856" dy="0">1280년 · 전각·법당 건립</tspan><tspan x="856" dy="29">1281년 · 사지 보수</tspan></text><rect x="782" y="504" width="320" height="54" rx="0" class="navy" opacity="1"/><text x="942" y="540" font-size="25" class="serif white" text-anchor="middle">남계원  南溪院</text><rect x="793" y="646" width="288" height="75" rx="0" class="cream" opacity="0.985"/><text x="937" y="690" font-size="19" class="sansb redtxt" text-anchor="middle">1281년 · 칠층석탑 복원</text><rect x="423" y="637" width="247" height="55" rx="0" class="navy" opacity="1"/><text x="547" y="674" font-size="27" class="serif white" text-anchor="middle">개경  開京</text><rect x="423" y="691" width="247" height="41" rx="0" class="cream" opacity="0.985"/><text x="547" y="719" font-size="17" class="sansb blue" text-anchor="middle">고려의 수도</text><rect x="1072" y="179" width="376" height="800" rx="0" class="cream" opacity="0.99"/><rect x="1072" y="183" width="376" height="53" rx="0" class="navy" opacity="1"/><text x="1260" y="218" font-size="26" class="serif white" text-anchor="middle">범례</text><text x="1162" y="275" font-size="17" class="sans blue" text-anchor="start"><tspan x="1162" dy="0">사찰 / 불교 조영</tspan><tspan x="1162" dy="43">복원된 탑</tspan><tspan x="1162" dy="43">수도</tspan><tspan x="1162" dy="43">감독 이동 경로</tspan><tspan x="1162" dy="43">(개경에서 출발)</tspan></text><rect x="1106" y="250" width="38" height="22" fill="#a52b22"/><path d="M1112 314 h26 v24 h-26z" fill="#083f4c"/><circle cx="1125" cy="384" r="14" fill="#154e7e"/><line x1="1106" y1="444" x2="1142" y2="444" stroke="#d22" stroke-width="5" stroke-dasharray="8 5"/><rect x="1072" y="457" width="376" height="53" rx="0" class="red" opacity="1"/><text x="1260" y="492" font-size="25" class="serif white" text-anchor="middle">주요 연표</text><text x="1105" y="546" font-size="18" class="sansb blue" text-anchor="start"><tspan x="1105" dy="0">1280년 — 현화사 조영</tspan><tspan x="1105" dy="31">1281년 — 보수·복원</tspan><tspan x="1105" dy="31">배경 — 충렬왕 재위</tspan></text><rect x="1072" y="626" width="376" height="53" rx="0" class="navy" opacity="1"/><text x="1260" y="661" font-size="23" class="serif white" text-anchor="middle">지도가 보여주는 것</text><circle cx="1118" cy="731" r="28" fill="#356c5c"/><circle cx="1118" cy="828" r="28" fill="#a52b22"/><circle cx="1118" cy="925" r="28" fill="#154e7e"/><text x="1118" y="739" font-size="20" class="serif white" text-anchor="middle">地</text><text x="1118" y="836" font-size="20" class="serif white" text-anchor="middle">王</text><text x="1118" y="933" font-size="20" class="serif white" text-anchor="middle">佛</text><text x="1160" y="715" font-size="17" class="sansb blue" text-anchor="start"><tspan x="1160" dy="0">고려 수도권에</tspan><tspan x="1160" dy="26">집중된 활동</tspan></text><text x="1160" y="812" font-size="17" class="sansb blue" text-anchor="start"><tspan x="1160" dy="0">왕실의 주도 아래</tspan><tspan x="1160" dy="26">진행된 사업</tspan></text><text x="1160" y="908" font-size="17" class="sansb blue" text-anchor="start"><tspan x="1160" dy="0">정치 권력과 불교 후원이</tspan><tspan x="1160" dy="26">교차하는 인물상</tspan></text><rect x="392" y="1033" width="666" height="48" rx="0" class="cream" opacity="0.98"/><text x="725" y="1063" font-size="15" class="serif blue" text-anchor="middle">사료를 바탕으로 한 개략도 · 위치는 대략적임</text></svg>