<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0e8">
<meta name="color-scheme" content="light">
<script>
(function(){
  try{
    var home=/^\/(fr|en|ko|ja|zh-hant|vi)\/(?:index\.html)?$/;
    if(!home.test(location.pathname)) return;
    var force=new URLSearchParams(location.search).get('intro')==='1';
    var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var seen=sessionStorage.getItem('bs-site-intro-v3');
    if(!force&&(reduced||seen)) document.documentElement.classList.add('site-intro-skip');
  }catch(e){}
})();
</script>
<script defer src="/assets/js/site.js"></script>
