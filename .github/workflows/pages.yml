name: Publish Quarto site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-latest
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Check Korean romanization
        run: python3 scripts/check_korean_romanization.py
      - name: Rebuild About image
        shell: bash
        run: |
          cat .github/site-assets/about-bryan.part{1..6} | tr -d '\n\r' | base64 --decode > assets/images/about-bryan-build.jpg
          echo "e4c7043d96908e7c313815616fad366c81cf8967de0e64af0d6c970bc2150899  assets/images/about-bryan-build.jpg" | sha256sum -c -
          file assets/images/about-bryan-build.jpg
          cat .github/site-assets/carnet-recherche-exact.{00..02} | tr -d '\n\r' | base64 --decode > assets/images/carnet-recherche-build.jpg
          echo "d0867964b943d9bec7be1eec61e2030b1e80a34e63f52df1fa8b4790db571fc4  assets/images/carnet-recherche-build.jpg" | sha256sum -c -
          file assets/images/carnet-recherche-build.jpg

      - name: Rebuild Research painting image
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --user-agent "Mozilla/5.0" \
            --referer "https://www.museum.go.kr/" \
            "https://www.museum.go.kr/relic_image/PS01001001/duk000/2019/0925174542564/duk003324-000-90000.jpg" \
            -o /tmp/koryo-choson-court-buddhist-art.jpg
          test -s /tmp/koryo-choson-court-buddhist-art.jpg
          file /tmp/koryo-choson-court-buddhist-art.jpg
          mv /tmp/koryo-choson-court-buddhist-art.jpg assets/images/koryo-choson-court-buddhist-art-20261019.jpg
      - name: Render
        run: quarto render
      - name: Ensure global navigation
        run: python3 scripts/ensure_global_header.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
