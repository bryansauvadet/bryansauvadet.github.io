name: Apply HQ fieldwork images

on:
  push:
    branches:
      - main
    paths:
      - "scripts/data/fieldwork-hq/**"
      - ".github/workflows/apply-fieldwork-hq.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract verified image bundles
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          source = Path("scripts/data/fieldwork-hq")
          target = Path("assets/images")
          target.mkdir(parents=True, exist_ok=True)

          expected_prefixes = ("but-thap-", "phat-tich-")
          for archive in sorted(source.glob("*.zip")):
              with ZipFile(archive) as zf:
                  for name in zf.namelist():
                      if "/" in name or "\\" in name:
                          raise SystemExit(f"Unsafe ZIP member: {name}")
                      if not name.endswith(".webp") or not name.startswith(expected_prefixes):
                          raise SystemExit(f"Unexpected ZIP member: {name}")
                  zf.extractall(target)
          PY

      - name: Remove one-time transfer files
        run: |
          rm -rf scripts/data/fieldwork-hq
          rm -f .github/workflows/apply-fieldwork-hq.yml

      - name: Commit high-quality images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Replace Bút Tháp and Phật Tích images with HQ originals"
          git push
